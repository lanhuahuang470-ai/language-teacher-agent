[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-teacher-agent"
version = "0.1.0"
description = "Stateful English tutor with isolated error retrieval"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-core==1.6.2",
    "langchain-openai==1.6.0",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.5",
    "python-dotenv==1.2.3",
    "gradio==5.23.1",
    "openai==2.54.0",
    "typing-extensions==4.16.0",
]

[project.scripts]
language-tutor = "language_tutor.ui.gradio_app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["language_tutor*", "graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:.*create_react_agent.*:DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
