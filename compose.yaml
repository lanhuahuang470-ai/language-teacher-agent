services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: tutor
    volumes:
      - tutor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: src/.env
    environment:
      DATABASE_URL: postgresql+psycopg://tutor:local_demo_only@db:5432/tutor
      TUTOR_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:7860:7860"
    depends_on:
      db:
        condition: service_healthy
volumes:
  tutor_pg:

